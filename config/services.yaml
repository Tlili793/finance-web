parameters:
    hcaptcha_site_key: '%env(HCAPTCHA_SITE_KEY)%'
    hcaptcha_secret_key: '%env(HCAPTCHA_SECRET_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\SecurityController:
        arguments:
            $hcaptchaSiteKey: '%hcaptcha_site_key%'
            $hcaptchaSecretKey: '%hcaptcha_secret_key%'


    App\Controller\PaymentController:
        arguments:
            $paymeeApiKey: '%env(PAYMEE_API_KEY)%'
            $paymeeUrl: '%env(PAYMEE_PAYMENT_URL)%'
            $mailerSender: 'yasmine912003@gmail.com'

    App\Controller\InsuranceAssistantController:
        arguments:
            $fastapiUrl: '%env(FASTAPI_URL)%'

    App\Controller\BoldSignWebhookController:
        arguments:
            $webhookSecret: '%env(BOLDSIGN_WEBHOOK_SECRET)%'

    App\Service\BoldSignService:
        arguments:
            $apiKey: '%env(BOLDSIGN_API_KEY)%'
            $baseUrl: '%env(BOLDSIGN_BASE_URL)%'
            $webhookUrl: '%env(BOLDSIGN_WEBHOOK_URL)%'

    App\Service\InsuranceMailerService:
        arguments:
            $mailerSender: 'yasmine912003@gmail.com'